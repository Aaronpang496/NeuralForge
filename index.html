<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>NeuralForge AI</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  /* --- BULLETPROOF MOBILE CSS --- */
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  input, textarea { font-family: inherit; font-size: 16px; } /* 16px prevents iOS auto-zoom */

  /* --- LAYOUT --- */
  #app { display: flex; flex-direction: column; height: 100dvh; width: 100%; position: relative; }
  
  header {
    height: 60px; background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(10px);
    border-bottom: 1px solid #1e293b; display: flex; align-items: center; justify-content: space-between;
    padding: 0 16px; flex-shrink: 0; z-index: 50; position: relative;
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .logo-small { width: 32px; height: 32px; background: linear-gradient(135deg, #6366f1, #a855f7); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: white; font-size: 16px; }
  .title { font-weight: 700; font-size: 17px; }
  .header-btn { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px; color: #94a3b8; }
  .header-btn:active { background: #1e293b; }

  /* --- CHAT AREA --- */
  #chatArea { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 16px; scroll-behavior: smooth; }
  .welcome { text-align: center; padding: 40px 20px; color: #64748b; }
  .welcome i { font-size: 40px; color: #6366f1; margin-bottom: 16px; }
  .welcome h2 { font-size: 20px; color: #f8fafc; margin-bottom: 8px; }
  .suggestions { display: flex; flex-direction: column; gap: 10px; max-width: 320px; margin: 20px auto 0; }
  .sugg-btn { background: #1e293b; border: 1px solid #334155; padding: 14px; border-radius: 12px; text-align: left; font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 10px; color: #f8fafc; width: 100%; }
  .sugg-btn:active { background: #334155; }

  /* --- MESSAGES --- */
  .msg { display: flex; flex-direction: column; max-width: 85%; animation: popIn 0.2s ease-out; }
  .msg.user { align-self: flex-end; align-items: flex-end; }
  .msg.ai { align-self: flex-start; align-items: flex-start; }
  @keyframes popIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  
  .bubble { padding: 12px 16px; border-radius: 18px; font-size: 15px; line-height: 1.5; word-wrap: break-word; position: relative; }
  .msg.user .bubble { background: #4f46e5; color: white; border-bottom-right-radius: 4px; }
  .msg.ai .bubble { background: #1e293b; color: #f8fafc; border: 1px solid #334155; border-bottom-left-radius: 4px; }
  .msg.error .bubble { border-color: #ef4444; background: #450a0a; color: #fca5a5; }

  .bubble strong { font-weight: 700; }
  .bubble p { margin-bottom: 8px; } .bubble p:last-child { margin-bottom: 0; }
  .bubble ul, .bubble ol { margin-left: 20px; margin-bottom: 8px; }
  .bubble code { background: rgba(0,0,0,0.3); padding: 2px 4px; border-radius: 4px; font-family: monospace; font-size: 13px; }

  /* --- INPUT AREA --- */
  #inputArea { background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(10px); border-top: 1px solid #1e293b; padding: 12px 16px; padding-bottom: calc(12px + env(safe-area-inset-bottom)); flex-shrink: 0; z-index: 50; position: relative; }
  .search-toggle { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; font-size: 13px; font-weight: 600; color: #94a3b8; }
  .toggle-switch { position: relative; width: 44px; height: 24px; }
  .toggle-switch input { opacity: 0; width: 0; height: 0; }
  .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #334155; transition: .3s; border-radius: 24px; }
  .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
  input:checked + .slider { background-color: #4f46e5; }
  input:checked + .slider:before { transform: translateX(20px); }
  
  .input-row { display: flex; gap: 10px; align-items: flex-end; }
  .input-wrap { flex: 1; background: #1e293b; border-radius: 24px; border: 1px solid #334155; padding: 4px 4px 4px 16px; display: flex; align-items: center; }
  .input-wrap:focus-within { border-color: #4f46e5; }
  #userInput { flex: 1; background: transparent; border: none; padding: 10px 0; resize: none; max-height: 120px; outline: none; color: #f8fafc; }
  #sendBtn { width: 44px; height: 44px; border-radius: 50%; background: #4f46e5; color: white; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
  #sendBtn:active { transform: scale(0.9); }
  #sendBtn:disabled { opacity: 0.5; }

  /* --- SIMPLE SETTINGS MODAL (No click bugs!) --- */
  #settingsModal {
    position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,0.7);
    display: none; align-items: flex-end; justify-content: center;
  }
  #settingsModal.open { display: flex; }
  .modal-content {
    width: 100%; background: #1e293b; border-radius: 20px 20px 0 0; padding: 20px;
    max-height: 80vh; overflow-y: auto; padding-bottom: calc(20px + env(safe-area-inset-bottom));
    animation: slideUp 0.3s ease-out;
  }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  
  .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .modal-header h2 { font-size: 18px; font-weight: 700; color: #f8fafc; }
  .close-btn { width: 32px; height: 32px; border-radius: 50%; background: #334155; display: flex; align-items: center; justify-content: center; color: #f8fafc; }
  
  .setting-group { margin-bottom: 20px; }
  .setting-label { font-size: 12px; font-weight: 700; color: #94a3b8; text-transform: uppercase; margin-bottom: 8px; letter-spacing: 0.5px; }
  .setting-input { width: 100%; background: #0f172a; border: 1px solid #334155; border-radius: 10px; padding: 12px; font-size: 15px; outline: none; color: #f8fafc; }
  .setting-input:focus { border-color: #4f46e5; }
  textarea.setting-input { min-height: 80px; resize: vertical; }
  
  .btn-primary { width: 100%; background: #4f46e5; color: white; padding: 14px; border-radius: 12px; font-weight: 600; font-size: 15px; margin-top: 10px; }
  .btn-primary:active { opacity: 0.8; }
  
  .memory-item { display: flex; justify-content: space-between; align-items: center; background: #0f172a; padding: 12px; border-radius: 10px; margin-bottom: 8px; font-size: 14px; color: #f8fafc; }
  .delete-mem { color: #ef4444; padding: 8px; }

  /* --- CONTEXT MENU --- */
  #contextMenu {
    position: fixed; z-index: 200; background: #1e293b; border-radius: 12px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.5); overflow: hidden; display: none;
    border: 1px solid #334155; min-width: 160px;
  }
  .ctx-btn { width: 100%; text-align: left; padding: 14px 16px; font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 10px; color: #f8fafc; }
  .ctx-btn:active { background: #334155; }
  .ctx-btn.danger { color: #ef4444; }

  /* --- TOAST --- */
  #toast {
    position: fixed; top: 80px; left: 50%; transform: translateX(-50%) translateY(-20px);
    background: #f8fafc; color: #0f172a; padding: 10px 20px; border-radius: 20px;
    font-size: 13px; font-weight: 600; opacity: 0; pointer-events: none; transition: 0.3s; z-index: 300;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div id="app">
  <header>
    <div class="brand">
      <div class="logo-small"><i class="fa-solid fa-brain"></i></div>
      <div class="title">NeuralForge</div>
    </div>
    <button class="header-btn" id="settingsBtn"><i class="fa-solid fa-sliders"></i></button>
  </header>

  <div id="chatArea">
    <div class="welcome" id="welcomeScreen">
      <i class="fa-solid fa-sparkles"></i>
      <h2>How can I help?</h2>
      <p>Long-press any message to edit or delete.</p>
      <div class="suggestions">
        <button class="sugg-btn" onclick="sendQuick('What are the latest AI news?')"><i class="fa-solid fa-globe" style="color:#f59e0b"></i> Latest AI news?</button>
        <button class="sugg-btn" onclick="sendQuick('Explain quantum computing simply')"><i class="fa-solid fa-atom" style="color:#8b5cf6"></i> Explain quantum computing</button>
      </div>
    </div>
  </div>

  <div id="inputArea">
    <div class="search-toggle">
      <label style="display:flex; align-items:center; gap:8px; cursor:pointer;">
        <label class="toggle-switch">
          <input type="checkbox" id="webSearchToggle" checked>
          <span class="slider"></span>
        </label>
        <span><i class="fa-solid fa-globe" style="color:#4f46e5"></i> Live Web Search</span>
      </label>
      <button onclick="clearChat()" style="font-size:12px; color:#64748b;">Clear</button>
    </div>
    <form class="input-row" id="chatForm">
      <div class="input-wrap">
        <textarea id="userInput" placeholder="Message NeuralForge..." rows="1"></textarea>
      </div>
      <button type="submit" id="sendBtn"><i class="fa-solid fa-paper-plane"></i></button>
    </form>
  </div>
</div>

<!-- Settings Modal -->
<div id="settingsModal">
  <div class="modal-content">
    <div class="modal-header">
      <h2>Settings & Memory</h2>
      <button class="close-btn" id="closeSettings"><i class="fa-solid fa-xmark"></i></button>
    </div>

    <div class="setting-group">
      <div class="setting-label">System Behavior</div>
      <textarea class="setting-input" id="sysPrompt">You are NeuralForge, a helpful AI on a mobile phone. Keep answers concise and easy to read.</textarea>
      <button class="btn-primary" onclick="saveSettings()">Save Behavior</button>
    </div>

    <div class="setting-group">
      <div class="setting-label">Custom Memory</div>
      <div style="display:flex; gap:8px; margin-bottom:12px;">
        <input type="text" class="setting-input" id="memInput" placeholder="e.g. My name is Alex" style="flex:1;">
        <button onclick="addMemory()" style="background:#4f46e5; color:white; padding:0 16px; border-radius:10px;"><i class="fa-solid fa-plus"></i></button>
      </div>
      <div id="memoryList"></div>
    </div>
  </div>
</div>

<!-- Context Menu -->
<div id="contextMenu">
  <button class="ctx-btn" id="ctxEdit"><i class="fa-solid fa-pen"></i> Edit & Resend</button>
  <button class="ctx-btn" id="ctxRegen"><i class="fa-solid fa-rotate"></i> Regenerate</button>
  <button class="ctx-btn" id="ctxCopy"><i class="fa-solid fa-copy"></i> Copy Text</button>
  <button class="ctx-btn danger" id="ctxDelete"><i class="fa-solid fa-trash"></i> Delete</button>
</div>

<div id="toast">Notification</div>

<script>
  // ==========================================
  // NO API KEY NEEDED! 
  // We use Pollinations.ai (Free, Open, No Auth)
  // ==========================================

  let messages = [];
  let memory = JSON.parse(localStorage.getItem('nf_memory') || '[]');
  let sysPrompt = localStorage.getItem('nf_sys') || 'You are NeuralForge, a helpful AI on a mobile phone. Keep answers concise and easy to read.';
  let isGenerating = false;
  let selectedMsgEl = null;
  let longPressTimer;

  document.getElementById('sysPrompt').value = sysPrompt;
  renderMemory();

  // --- UI Interactions ---
  const settingsModal = document.getElementById('settingsModal');
  document.getElementById('settingsBtn').onclick = () => settingsModal.classList.add('open');
  document.getElementById('closeSettings').onclick = () => settingsModal.classList.remove('open');
  settingsModal.onclick = (e) => { if(e.target === settingsModal) settingsModal.classList.remove('open'); };

  const ctxMenu = document.getElementById('contextMenu');
  document.addEventListener('click', (e) => {
    if (!ctxMenu.contains(e.target)) ctxMenu.style.display = 'none';
  });

  // --- Chat Logic ---
  function sendQuick(text) {
    document.getElementById('userInput').value = text;
    document.getElementById('chatForm').dispatchEvent(new Event('submit'));
  }

  function clearChat() {
    if(confirm('Clear all messages?')) {
      messages = [];
      document.getElementById('chatArea').innerHTML = `
        <div class="welcome" id="welcomeScreen">
          <i class="fa-solid fa-sparkles"></i>
          <h2>Chat Cleared</h2>
          <p>Ready for a new topic.</p>
        </div>`;
    }
  }

  document.getElementById('chatForm').onsubmit = async (e) => {
    e.preventDefault();
    if (isGenerating) return;
    const input = document.getElementById('userInput');
    const text = input.value.trim();
    if (!text) return;

    // Remove welcome screen
    const welcome = document.getElementById('welcomeScreen');
    if (welcome) welcome.remove();

    addMessageToUI(text, 'user');
    input.value = '';
    isGenerating = true;
    document.getElementById('sendBtn').disabled = true;

    const useWeb = document.getElementById('webSearchToggle').checked;
    let finalPrompt = text;

    if (useWeb) {
      showTyping("🔍 Searching web...");
      const results = await searchWeb(text);
      removeTyping();
      finalPrompt = `User Query: ${text}\n\n[INSTRUCTIONS: Use this live web context to answer accurately. Keep it concise for mobile.]\n\n[WEB CONTEXT]:\n${results}`;
    }

    showTyping("Thinking...");
    
    let systemMsg = sysPrompt;
    if (memory.length > 0) {
      systemMsg += "\n\n[USER MEMORY]:\n" + memory.map(m => `- ${m}`).join('\n');
    }

    messages.push({ role: 'user', content: finalPrompt });

    try {
      // Using Pollinations.ai OpenAI-compatible endpoint (No API Key required!)
      const res = await fetch("https://text.pollinations.ai/openai", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: "openai", // Uses a high-quality model
          messages: [{ role: "system", content: systemMsg }, ...messages.slice(-6)],
          stream: true
        })
      });

      if (!res.ok) throw new Error(`Server error ${res.status}`);

      // Handle Streaming
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let aiText = "";
      
      // Create AI message bubble for streaming
      const aiMsgDiv = document.createElement('div');
      aiMsgDiv.className = 'msg ai';
      aiMsgDiv.innerHTML = `<div class="bubble" id="streamBubble"></div>`;
      document.getElementById('chatArea').appendChild(aiMsgDiv);
      const streamBubble = document.getElementById('streamBubble');

      removeTyping(); // Remove the "Thinking..." indicator

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        
        const chunk = decoder.decode(value, { stream: true });
        const lines = chunk.split('\n').filter(line => line.trim() !== '');
        
        for (const line of lines) {
          if (line.startsWith('data: ')) {
            const data = line.slice(6);
            if (data === '[DONE]') break;
            try {
              const json = JSON.parse(data);
              const content = json.choices?.[0]?.delta?.content || '';
              if (content) {
                aiText += content;
                streamBubble.innerHTML = formatText(aiText) + '<span class="cursor">▋</span>';
                document.getElementById('chatArea').scrollTop = document.getElementById('chatArea').scrollHeight;
              }
            } catch (e) {}
          }
        }
      }

      // Finalize
      streamBubble.innerHTML = formatText(aiText);
      messages.push({ role: 'assistant', content: aiText });

    } catch (err) {
      removeTyping();
      addMessageToUI(`⚠️ Error: ${err.message}. The free AI server might be busy. Try again in a moment.`, 'error');
    } finally {
      isGenerating = false;
      document.getElementById('sendBtn').disabled = false;
    }
  };

  function formatText(text) {
    return text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>');
  }

  function addMessageToUI(text, type) {
    const chatArea = document.getElementById('chatArea');
    const div = document.createElement('div');
    div.className = `msg ${type}`;
    div.dataset.text = text;
    div.innerHTML = `<div class="bubble">${formatText(text)}</div>`;
    chatArea.appendChild(div);
    chatArea.scrollTop = chatArea.scrollHeight;

    // Long press logic
    div.addEventListener('touchstart', (e) => {
      longPressTimer = setTimeout(() => showContextMenu(e, div, text, type), 500);
    });
    div.addEventListener('touchend', () => clearTimeout(longPressTimer));
    div.addEventListener('touchmove', () => clearTimeout(longPressTimer));
  }

  function showTyping(text) {
    const chatArea = document.getElementById('chatArea');
    const div = document.createElement('div');
    div.className = 'msg ai';
    div.id = 'typingIndicator';
    div.innerHTML = `<div class="bubble" style="color:#94a3b8; font-style:italic;">${text} <i class="fa-solid fa-circle-notch fa-spin"></i></div>`;
    chatArea.appendChild(div);
    chatArea.scrollTop = chatArea.scrollHeight;
  }

  function removeTyping() {
    const el = document.getElementById('typingIndicator');
    if (el) el.remove();
  }

  // --- Context Menu & Editing ---
  function showContextMenu(e, el, text, type) {
    selectedMsgEl = el;
    const touch = e.touches[0];
    ctxMenu.style.left = Math.min(touch.clientX, window.innerWidth - 170) + 'px';
    ctxMenu.style.top = Math.min(touch.clientY, window.innerHeight - 200) + 'px';
    ctxMenu.style.display = 'block';

    document.getElementById('ctxEdit').style.display = type === 'user' ? 'flex' : 'none';
    document.getElementById('ctxRegen').style.display = type === 'ai' ? 'flex' : 'none';
  }

  document.getElementById('ctxCopy').onclick = () => {
    navigator.clipboard.writeText(selectedMsgEl.dataset.text);
    showToast("Copied!");
    ctxMenu.style.display = 'none';
  };

  document.getElementById('ctxDelete').onclick = () => {
    selectedMsgEl.remove();
    showToast("Deleted");
    ctxMenu.style.display = 'none';
  };

  document.getElementById('ctxEdit').onclick = () => {
    const text = selectedMsgEl.dataset.text;
    document.getElementById('userInput').value = text;
    selectedMsgEl.remove();
    ctxMenu.style.display = 'none';
    document.getElementById('userInput').focus();
  };

  document.getElementById('ctxRegen').onclick = () => {
    const idx = messages.findIndex(m => m.role === 'assistant' && m.content === selectedMsgEl.dataset.text);
    if (idx > 0) {
      const prevUser = messages[idx - 1].content;
      messages = messages.slice(0, idx);
      selectedMsgEl.remove();
      document.getElementById('userInput').value = prevUser.replace(/User Query: (.*?)\n\n.*/s, '$1').trim();
      document.getElementById('chatForm').dispatchEvent(new Event('submit'));
    }
    ctxMenu.style.display = 'none';
  };

  // --- Web Search ---
  async function searchWeb(query) {
    try {
      const url = `https://api.allorigins.win/get?url=${encodeURIComponent('https://html.duckduckgo.com/html/?q=' + query)}`;
      const res = await fetch(url);
      const data = await res.json();
      if (!data.contents) return "No results.";
      
      const parser = new DOMParser();
      const doc = parser.parseFromString(data.contents, 'text/html');
      const snippets = Array.from(doc.querySelectorAll('.result__snippet')).map(el => el.textContent.trim());
      
      if (snippets.length === 0) return "No relevant results found.";
      return snippets.slice(0, 3).map((s, i) => `${i+1}. ${s}`).join('\n');
    } catch (e) {
      return "Web search failed.";
    }
  }

  // --- Memory & Settings ---
  function saveSettings() {
    sysPrompt = document.getElementById('sysPrompt').value;
    localStorage.setItem('nf_sys', sysPrompt);
    showToast("Settings saved!");
    settingsModal.classList.remove('open');
  }

  function addMemory() {
    const input = document.getElementById('memInput');
    const text = input.value.trim();
    if (!text) return;
    memory.push(text);
    localStorage.setItem('nf_memory', JSON.stringify(memory));
    input.value = '';
    renderMemory();
    showToast("Memory added!");
  }

  function deleteMemory(index) {
    memory.splice(index, 1);
    localStorage.setItem('nf_memory', JSON.stringify(memory));
    renderMemory();
  }

  function renderMemory() {
    const list = document.getElementById('memoryList');
    if (memory.length === 0) {
      list.innerHTML = '<p style="font-size:13px; color:#64748b; text-align:center;">No custom memory yet.</p>';
      return;
    }
    list.innerHTML = memory.map((m, i) => `
      <div class="memory-item">
        <span>${m}</span>
        <button class="delete-mem" onclick="deleteMemory(${i})"><i class="fa-solid fa-trash"></i></button>
      </div>
    `).join('');
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  }
</script>
</body>
</html>
