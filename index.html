<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
    <title>NeuralForge Mobile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['-apple-system', 'BlinkMacSystemFont', 'Inter', 'sans-serif'] },
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif; 
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .fade-in { animation: fadeIn 0.2s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .bubble-user { 
            background: #4F46E5; 
            color: white; 
            border-radius: 18px 18px 4px 18px; 
        }
        .dark .bubble-user { background: #6366F1; }
        
        .bubble-ai { 
            background: #E2E8F0; 
            color: #0F172A; 
            border-radius: 18px 18px 18px 4px; 
        }
        .dark .bubble-ai { background: #1E293B; color: #F1F5F9; }

        .prose p { margin-bottom: 0.5em; line-height: 1.5; }
        .prose strong { font-weight: 600; }

        /* Context menu */
        .context-menu {
            animation: menuFade 0.15s ease-out;
        }
        @keyframes menuFade {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        /* Edit mode */
        .edit-mode textarea {
            min-height: 80px;
            resize: vertical;
        }
    </style>
</head>
<body class="h-[100dvh] w-full bg-white dark:bg-slate-950 text-slate-900 dark:text-slate-100 flex flex-col overflow-hidden">

    <header class="flex-none h-14 bg-white/90 dark:bg-slate-900/90 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 flex items-center justify-between px-4 z-20 sticky top-0">
        <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-full bg-gradient-to-br from-indigo-500 to-violet-600 flex items-center justify-center text-white shadow-md">
                <i class="fa-solid fa-brain text-sm"></i>
            </div>
            <div>
                <h1 class="font-semibold text-base leading-tight">NeuralForge</h1>
                <p class="text-[10px] text-slate-500 dark:text-slate-400 font-medium">Online • Smart Search</p>
            </div>
        </div>
        <button onclick="toggleSettings()" class="w-10 h-10 rounded-full flex items-center justify-center text-slate-600 dark:text-slate-300 active:bg-slate-100 dark:active:bg-slate-800 transition">
            <i class="fa-solid fa-sliders text-lg"></i>
        </button>
    </header>

    <main id="chatView" class="flex-1 overflow-y-auto no-scrollbar p-4 space-y-4 bg-slate-50 dark:bg-slate-950 scroll-smooth">
        <div class="flex flex-col items-center text-center py-8 fade-in">
            <div class="w-16 h-16 rounded-2xl bg-indigo-100 dark:bg-indigo-900/30 text-indigo-600 dark:text-indigo-400 flex items-center justify-center text-2xl mb-3 shadow-sm">
                <i class="fa-solid fa-sparkles"></i>
            </div>
            <h2 class="font-semibold text-lg mb-1">How can I help you today?</h2>
            <p class="text-sm text-slate-500 dark:text-slate-400 max-w-xs mb-6">Long-press any message to edit or delete it.</p>
            
            <div class="grid grid-cols-1 gap-2 w-full max-w-xs">
                <button onclick="sendQuickPrompt('What are the latest AI news today?')" class="text-sm p-3 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-left active:scale-95 transition shadow-sm">
                    🌐 <span class="font-medium">Latest AI news today?</span>
                </button>
                <button onclick="sendQuickPrompt('Explain quantum computing like I am 5')" class="text-sm p-3 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-left active:scale-95 transition shadow-sm">
                    🧠 <span class="font-medium">Explain quantum computing simply</span>
                </button>
            </div>
        </div>
    </main>

    <div class="flex-none bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 p-3 pb-[calc(0.75rem+env(safe-area-inset-bottom))] z-20">
        <div class="flex items-center justify-between px-1 mb-2">
            <label class="flex items-center gap-2 cursor-pointer">
                <div class="relative inline-flex items-center cursor-pointer">
                    <input type="checkbox" id="webSearchToggle" class="sr-only peer" checked>
                    <div class="w-9 h-5 bg-slate-200 peer-focus:outline-none rounded-full peer dark:bg-slate-700 peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-indigo-600"></div>
                </div>
                <span class="text-xs font-medium text-slate-600 dark:text-slate-300 flex items-center gap-1">
                    <i class="fa-solid fa-globe text-indigo-500"></i> Live Web Search
                </span>
            </label>
            <button onclick="clearChat()" class="text-xs text-slate-400 active:text-red-500 transition font-medium">Clear</button>
        </div>

        <form id="chatForm" onsubmit="handleChatSubmit(event)" class="flex items-end gap-2">
            <div class="flex-1 bg-slate-100 dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 focus-within:ring-2 focus-within:ring-indigo-500 focus-within:border-transparent transition">
                <input 
                    type="text" 
                    id="userInput" 
                    placeholder="Message NeuralForge..." 
                    class="w-full bg-transparent px-4 py-3 text-base focus:outline-none dark:text-white placeholder-slate-400"
                    autocomplete="off"
                    enterkeyhint="send"
                >
            </div>
            <button 
                type="submit" 
                id="sendBtn"
                class="w-12 h-12 bg-indigo-600 hover:bg-indigo-700 active:scale-90 text-white rounded-full flex items-center justify-center transition shadow-md disabled:opacity-50 disabled:active:scale-100 flex-shrink-0"
            >
                <i class="fa-solid fa-paper-plane text-lg"></i>
            </button>
        </form>
    </div>

    <!-- Context Menu (Hidden by default) -->
    <div id="contextMenu" class="fixed z-50 hidden">
        <div class="bg-white dark:bg-slate-800 rounded-xl shadow-xl border border-slate-200 dark:border-slate-700 overflow-hidden context-menu">
            <button id="editBtn" class="w-full px-4 py-3 text-left text-sm font-medium text-slate-700 dark:text-slate-200 active:bg-slate-100 dark:active:bg-slate-700 flex items-center gap-2">
                <i class="fa-solid fa-pen text-xs"></i> Edit Message
            </button>
            <button id="deleteBtn" class="w-full px-4 py-3 text-left text-sm font-medium text-red-600 dark:text-red-400 active:bg-red-50 dark:active:bg-red-900/30 flex items-center gap-2 border-t border-slate-100 dark:border-slate-700">
                <i class="fa-solid fa-trash-can text-xs"></i> Delete Message
            </button>
            <button id="regenerateBtn" class="w-full px-4 py-3 text-left text-sm font-medium text-indigo-600 dark:text-indigo-400 active:bg-indigo-50 dark:active:bg-indigo-900/30 flex items-center gap-2 border-t border-slate-100 dark:border-slate-700 hidden">
                <i class="fa-solid fa-rotate text-xs"></i> Regenerate Response
            </button>
        </div>
    </div>

    <div id="settingsPanel" class="fixed inset-0 z-50 transform translate-y-full transition-transform duration-300 ease-out bg-white dark:bg-slate-950 flex flex-col">
        <div class="flex-none h-14 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between px-4 bg-white dark:bg-slate-950">
            <button onclick="toggleSettings()" class="w-10 h-10 rounded-full flex items-center justify-center text-indigo-600 dark:text-indigo-400 active:bg-slate-100 dark:active:bg-slate-800 transition">
                <i class="fa-solid fa-chevron-down text-lg"></i>
            </button>
            <h2 class="font-semibold text-base">AI Memory & Settings</h2>
            <div class="w-10"></div>
        </div>

        <div class="flex-1 overflow-y-auto p-4 space-y-6 no-scrollbar">
            <div class="space-y-2">
                <label class="text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider">Behavior</label>
                <textarea id="settingSystemPrompt" rows="3" class="w-full p-3 text-sm bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 dark:text-white resize-none">You are NeuralForge, a highly intelligent, concise, and helpful AI assistant on a mobile device. Keep answers brief and easy to read on a small screen.</textarea>
                <button onclick="saveSettings()" class="w-full py-2.5 bg-indigo-600 text-white text-sm font-semibold rounded-xl active:scale-95 transition">Save Behavior</button>
            </div>

            <div class="space-y-3">
                <div class="flex items-center justify-between">
                    <label class="text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider">Custom Memory</label>
                    <span id="trainingPairsCount" class="text-[10px] font-bold px-2 py-1 rounded-full bg-indigo-100 dark:bg-indigo-900/50 text-indigo-600 dark:text-indigo-400">0 Items</span>
                </div>
                
                <div class="flex gap-2">
                    <input type="text" id="trainKeyword" placeholder="e.g., My name is Alex, I love coding" class="flex-1 p-3 text-sm bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 dark:text-white">
                    <button onclick="addTrainingPair()" class="px-4 bg-slate-800 dark:bg-slate-700 text-white rounded-xl active:scale-95 transition">
                        <i class="fa-solid fa-plus"></i>
                    </button>
                </div>

                <div id="trainingPairsList" class="space-y-2 pb-20"></div>
            </div>
        </div>
    </div>

    <div id="toast" class="fixed top-20 left-1/2 transform -translate-x-1/2 z-[60] translate-y-[-150%] opacity-0 transition-all duration-300 pointer-events-none bg-slate-900 dark:bg-white text-white dark:text-slate-900 px-4 py-2.5 rounded-full shadow-xl flex items-center space-x-2 text-xs font-semibold">
        <i id="toastIcon" class="fa-solid fa-circle-check text-emerald-400 text-sm"></i>
        <span id="toastMessage">Notification</span>
    </div>

    <script>
        const ENCODED_API_KEY = "c2stb3ItdjEtOTI2NmJmNjQxNTlmNWNlZGU5YzUzNzE0Zjg1NDExMDIwMzM2OTc4NTE1MmJkN2Y4NTE2MjI4NWYzY2Y0OWVkNw==";
        
        function getApiKey() {
            try {
                const decoded = atob(ENCODED_API_KEY);
                if (decoded.includes("YOUR_API_KEY")) return "";
                return decoded;
            } catch (e) { return ""; }
        }

        let settings = {
            systemPrompt: localStorage.getItem('neural_system_prompt') || 'You are NeuralForge, a highly intelligent, concise, and helpful AI assistant on a mobile device. Keep answers brief and easy to read on a small screen.'
        };
        let trainingPairs = JSON.parse(localStorage.getItem('neural_training_pairs') || '[]');
        let conversationHistory = []; 
        let messageIdCounter = 0;
        let selectedMessageId = null;
        let longPressTimer = null;

        window.onload = function() {
            document.getElementById('settingSystemPrompt').value = settings.systemPrompt;
            renderTrainingPairs();
            
            if (localStorage.getItem('neural_theme') === 'dark' || (!localStorage.getItem('neural_theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            }

            // Close context menu on outside click
            document.addEventListener('click', (e) => {
                const menu = document.getElementById('contextMenu');
                if (!menu.contains(e.target)) {
                    menu.classList.add('hidden');
                }
            });
        };

        function toggleSettings() {
            const panel = document.getElementById('settingsPanel');
            if (panel.classList.contains('translate-y-full')) {
                panel.classList.remove('translate-y-full');
            } else {
                panel.classList.add('translate-y-full');
            }
        }

        function sendQuickPrompt(text) {
            document.getElementById('userInput').value = text;
            handleChatSubmit(new Event('submit'));
        }

        function clearChat() {
            if (confirm('Clear all messages?')) {
                conversationHistory = [];
                document.getElementById('chatView').innerHTML = `
                    <div class="flex flex-col items-center text-center py-8 fade-in">
                        <div class="w-16 h-16 rounded-2xl bg-indigo-100 dark:bg-indigo-900/30 text-indigo-600 dark:text-indigo-400 flex items-center justify-center text-2xl mb-3 shadow-sm">
                            <i class="fa-solid fa-sparkles"></i>
                        </div>
                        <h2 class="font-semibold text-lg mb-1">Chat Cleared</h2>
                        <p class="text-sm text-slate-500 dark:text-slate-400 max-w-xs">Memory reset. Ready for a new topic.</p>
                    </div>
                `;
            }
        }

        async function performWebSearch(query) {
            try {
                const targetUrl = `https://html.duckduckgo.com/html?q=${encodeURIComponent(query)}`;
                const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}`;
                const response = await fetch(proxyUrl);
                const data = await response.json();
                
                if (!data.contents) return "No search results found.";
                
                const parser = new DOMParser();
                const doc = parser.parseFromString(data.contents, 'text/html');
                const snippets = Array.from(doc.querySelectorAll('.result__snippet')).map(el => el.textContent.trim());
                
                if (snippets.length === 0) {
                    const wikiRes = await fetch(`https://en.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(query)}&srlimit=3&format=json&origin=*`);
                    const wikiData = await wikiRes.json();
                    if (wikiData.query && wikiData.query.search.length > 0) {
                        return "Wikipedia Context: " + wikiData.query.search.map(s => `[${s.title}] ${s.snippet.replace(/<[^>]*>/g, '')}`).join(" | ");
                    }
                    return "No relevant web results found.";
                }
                return "Live Web Search Results:\n" + snippets.slice(0, 3).map((s, i) => `${i+1}. ${s}`).join("\n");
            } catch (error) {
                console.error("Web search error:", error);
                return "Web search failed due to network issues.";
            }
        }

        async function handleChatSubmit(e, editData = null) {
            e.preventDefault();
            const inputField = document.getElementById('userInput');
            const messageText = inputField.value.trim();
            if (!messageText) return;

            const isEdit = editData !== null;
            const messageId = isEdit ? editData.id : ++messageIdCounter;
            
            if (isEdit) {
                // Remove old message and all subsequent messages
                const msgIndex = conversationHistory.findIndex(m => m.messageId === messageId);
                if (msgIndex !== -1) {
                    conversationHistory = conversationHistory.slice(0, msgIndex);
                }
                // Remove DOM elements
                const oldMsg = document.querySelector(`[data-message-id="${messageId}"]`);
                if (oldMsg) {
                    let next = oldMsg.nextElementSibling;
                    while (next && !next.dataset.messageId) {
                        const toRemove = next;
                        next = next.nextElementSibling;
                        toRemove.remove();
                    }
                    oldMsg.remove();
                }
            }

            appendMessage(messageText, 'user', messageId);
            inputField.value = '';
            document.getElementById('sendBtn').disabled = true;

            const apiKey = getApiKey();
            if (!apiKey || apiKey.includes("YOUR_API_KEY")) {
                showToast("⚠️ API Key missing! Edit the code.", "error");
                appendMessage("Error: API key is not configured. Please edit the HTML file and add your Base64-encoded OpenRouter API key.", 'ai');
                document.getElementById('sendBtn').disabled = false;
                return;
            }

            const isWebSearchEnabled = document.getElementById('webSearchToggle').checked;
            let finalUserMessage = messageText;

            if (isWebSearchEnabled) {
                const searchThinkingId = showThinkingIndicator("🔍 Searching the web...");
                const searchResults = await performWebSearch(messageText);
                removeThinkingIndicator(searchThinkingId);
                finalUserMessage = `User Query: ${messageText}\n\n[INSTRUCTIONS: Use the following live web search context to answer accurately. Keep it concise for mobile reading. Cite sources if applicable.]\n\n[WEB CONTEXT]:\n${searchResults}`;
            }

            const thinkingId = showThinkingIndicator("Thinking...");

            let systemContent = settings.systemPrompt;
            if (trainingPairs.length > 0) {
                systemContent += "\n\n[USER'S CUSTOM MEMORY]:\n" + trainingPairs.map(p => `- ${p.keyword}`).join("\n");
            }

            conversationHistory.push({ role: "user", content: finalUserMessage, messageId: messageId });

            try {
                const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${apiKey}`,
                        "Content-Type": "application/json",
                        "HTTP-Referer": window.location.href, 
                        "X-Title": "NeuralForge Mobile"
                    },
                    body: JSON.stringify({
                        "model": "meta-llama/llama-3.1-8b-instruct:free",
                        "messages": [
                            { "role": "system", "content": systemContent },
                            ...conversationHistory.slice(-6).map(m => ({ role: m.role, content: m.content }))
                        ]
                    })
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error?.message || `HTTP ${response.status}`);
                }

                const data = await response.json();
                const aiText = data.choices[0].message.content;

                removeThinkingIndicator(thinkingId);
                const aiMessageId = ++messageIdCounter;
                appendMessage(aiText, 'ai', aiMessageId);
                conversationHistory.push({ role: "assistant", content: aiText, messageId: aiMessageId });

            } catch (error) {
                console.error("Chat error:", error);
                removeThinkingIndicator(thinkingId);
                appendMessage(`⚠️ Error: ${error.message}`, 'ai');
            } finally {
                document.getElementById('sendBtn').disabled = false;
                inputField.focus();
            }
        }

        function appendMessage(text, sender, messageId = null) {
            const welcome = document.querySelector('#chatView .flex-col.items-center');
            if (welcome) welcome.remove();

            const chatView = document.getElementById('chatView');
            const isUser = sender === 'user';
            
            const messageDiv = document.createElement('div');
            messageDiv.className = `flex w-full fade-in ${isUser ? 'justify-end' : 'justify-start'}`;
            messageDiv.dataset.messageId = messageId;
            messageDiv.dataset.sender = sender;

            const bubbleClass = isUser ? 'bubble-user' : 'bubble-ai';
            const formattedText = escapeHTML(text).replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>');

            messageDiv.innerHTML = `
                <div class="max-w-[85%] ${bubbleClass} px-4 py-2.5 shadow-sm prose dark:prose-invert text-[15px] leading-snug">
                    ${formattedText}
                </div>
            `;

            // Long press detection
            let pressTimer;
            messageDiv.addEventListener('touchstart', (e) => {
                pressTimer = setTimeout(() => {
                    showContextMenu(e, messageId, sender, text);
                }, 500);
            });

            messageDiv.addEventListener('touchend', () => {
                clearTimeout(pressTimer);
            });

            messageDiv.addEventListener('touchmove', () => {
                clearTimeout(pressTimer);
            });

            chatView.appendChild(messageDiv);
            setTimeout(() => {
                chatView.scrollTo({ top: chatView.scrollHeight, behavior: 'smooth' });
            }, 50);
        }

        function showContextMenu(event, messageId, sender, originalText) {
            event.preventDefault();
            selectedMessageId = messageId;
            
            const menu = document.getElementById('contextMenu');
            const editBtn = document.getElementById('editBtn');
            const deleteBtn = document.getElementById('deleteBtn');
            const regenerateBtn = document.getElementById('regenerateBtn');

            // Show/hide options based on sender
            if (sender === 'user') {
                editBtn.classList.remove('hidden');
                regenerateBtn.classList.add('hidden');
            } else {
                editBtn.classList.add('hidden');
                regenerateBtn.classList.remove('hidden');
            }

            // Position menu
            const touch = event.touches ? event.touches[0] : event;
            const x = touch.clientX || touch.pageX;
            const y = touch.clientY || touch.pageY;

            menu.style.left = `${Math.min(x, window.innerWidth - 200)}px`;
            menu.style.top = `${Math.min(y, window.innerHeight - 150)}px`;
            menu.classList.remove('hidden');

            // Set up handlers
            editBtn.onclick = () => editMessage(messageId, originalText);
            deleteBtn.onclick = () => deleteMessage(messageId);
            regenerateBtn.onclick = () => regenerateResponse(messageId);
        }

        function editMessage(messageId, originalText) {
            const menu = document.getElementById('contextMenu');
            menu.classList.add('hidden');

            const msgElement = document.querySelector(`[data-message-id="${messageId}"]`);
            if (!msgElement) return;

            const bubble = msgElement.querySelector('.bubble-user, .bubble-ai');
            const originalHTML = bubble.innerHTML;

            // Replace with edit UI
            bubble.innerHTML = `
                <div class="edit-mode space-y-2">
                    <textarea class="w-full p-2 text-[15px] bg-white/20 dark:bg-black/20 rounded-lg border border-white/30 dark:border-white/20 focus:outline-none focus:ring-2 focus:ring-white/50 resize-none" style="min-height: 80px;">${originalText}</textarea>
                    <div class="flex gap-2">
                        <button class="flex-1 py-2 bg-white/20 dark:bg-black/20 rounded-lg text-sm font-semibold active:scale-95 transition" onclick="cancelEdit('${messageId}')">Cancel</button>
                        <button class="flex-1 py-2 bg-white text-indigo-600 rounded-lg text-sm font-semibold active:scale-95 transition" onclick="saveEdit('${messageId}')">Save & Send</button>
                    </div>
                </div>
            `;

            const textarea = bubble.querySelector('textarea');
            textarea.focus();
            textarea.setSelectionRange(textarea.value.length, textarea.value.length);
        }

        function cancelEdit(messageId) {
            location.reload(); // Simple reload to restore state
        }

        function saveEdit(messageId) {
            const msgElement = document.querySelector(`[data-message-id="${messageId}"]`);
            if (!msgElement) return;

            const textarea = msgElement.querySelector('textarea');
            const newText = textarea.value.trim();

            if (!newText) {
                showToast("Message cannot be empty", "error");
                return;
            }

            // Resubmit with edit data
            const editData = { id: parseInt(messageId) };
            document.getElementById('userInput').value = newText;
            handleChatSubmit(new Event('submit'), editData);
        }

        function deleteMessage(messageId) {
            const menu = document.getElementById('contextMenu');
            menu.classList.add('hidden');

            if (!confirm('Delete this message?')) return;

            const msgElement = document.querySelector(`[data-message-id="${messageId}"]`);
            if (msgElement) {
                // Remove from history
                const msgIndex = conversationHistory.findIndex(m => m.messageId === messageId);
                if (msgIndex !== -1) {
                    conversationHistory.splice(msgIndex, 1);
                }
                msgElement.remove();
                showToast("Message deleted");
            }
        }

        async function regenerateResponse(messageId) {
            const menu = document.getElementById('contextMenu');
            menu.classList.add('hidden');

            const msgElement = document.querySelector(`[data-message-id="${messageId}"]`);
            if (!msgElement) return;

            // Find the user message before this AI response
            const msgIndex = conversationHistory.findIndex(m => m.messageId === messageId);
            if (msgIndex === -1) return;

            // Get the previous user message
            let userMsgIndex = msgIndex - 1;
            while (userMsgIndex >= 0 && conversationHistory[userMsgIndex].role !== 'user') {
                userMsgIndex--;
            }

            if (userMsgIndex < 0) {
                showToast("No user message found", "error");
                return;
            }

            const userMessage = conversationHistory[userMsgIndex].content;
            const userMessageId = conversationHistory[userMsgIndex].messageId;

            // Remove the AI response
            conversationHistory.splice(msgIndex, 1);
            msgElement.remove();

            // Regenerate
            document.getElementById('userInput').value = userMessage.replace(/\[INSTRUCTIONS:.*?\[WEB CONTEXT\]:\n.*$/s, '').trim();
            handleChatSubmit(new Event('submit'), { id: userMessageId, regenerate: true });
        }

        function showThinkingIndicator(text) {
            const chatView = document.getElementById('chatView');
            const id = 'thinking-' + Date.now();
            const div = document.createElement('div');
            div.id = id;
            div.className = 'flex w-full justify-start fade-in';
            div.innerHTML = `
                <div class="bubble-ai px-4 py-3 flex items-center gap-2">
                    <span class="text-xs text-slate-500 dark:text-slate-400 italic">${text}</span>
                    <div class="flex gap-1">
                        <div class="w-1.5 h-1.5 rounded-full bg-indigo-500 animate-bounce" style="animation-delay: 0s"></div>
                        <div class="w-1.5 h-1.5 rounded-full bg-indigo-500 animate-bounce" style="animation-delay: 0.15s"></div>
                        <div class="w-1.5 h-1.5 rounded-full bg-indigo-500 animate-bounce" style="animation-delay: 0.3s"></div>
                    </div>
                </div>
            `;
            chatView.appendChild(div);
            chatView.scrollTo({ top: chatView.scrollHeight, behavior: 'smooth' });
            return id;
        }

        function removeThinkingIndicator(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
        }

        function addTrainingPair() {
            const kw = document.getElementById('trainKeyword').value.trim();
            if (!kw) { showToast("Enter a fact first!", "error"); return; }
            
            trainingPairs.push({ id: Date.now(), keyword: kw });
            document.getElementById('trainKeyword').value = '';
            renderTrainingPairs();
            saveData();
            showToast("Memory updated!");
        }

        function deleteTrainingPair(id) {
            trainingPairs = trainingPairs.filter(p => p.id !== id);
            renderTrainingPairs();
            saveData();
        }

        function renderTrainingPairs() {
            const container = document.getElementById('trainingPairsList');
            document.getElementById('trainingPairsCount').innerText = `${trainingPairs.length} Items`;
            
            if (trainingPairs.length === 0) {
                container.innerHTML = `<p class="text-xs text-slate-400 text-center py-4">No custom memory added yet.</p>`;
                return;
            }
            
            container.innerHTML = trainingPairs.map(p => `
                <div class="flex items-center justify-between p-3 rounded-xl bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-800">
                    <p class="text-sm text-slate-700 dark:text-slate-200 flex-1 truncate pr-2">${escapeHTML(p.keyword)}</p>
                    <button onclick="deleteTrainingPair(${p.id})" class="w-8 h-8 rounded-full text-slate-400 active:text-red-500 active:bg-red-50 dark:active:bg-red-900/30 flex items-center justify-center transition">
                        <i class="fa-solid fa-trash-can text-xs"></i>
                    </button>
                </div>
            `).join('');
        }

        function saveSettings() {
            settings.systemPrompt = document.getElementById('settingSystemPrompt').value;
            localStorage.setItem('neural_system_prompt', settings.systemPrompt);
            showToast("Behavior saved!");
            toggleSettings();
        }

        function saveData() {
            localStorage.setItem('neural_training_pairs', JSON.stringify(trainingPairs));
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
        }

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            document.getElementById('toastMessage').innerText = message;
            document.getElementById('toastIcon').className = type === 'error' ? "fa-solid fa-circle-exclamation text-red-400 text-sm" : "fa-solid fa-circle-check text-emerald-400 text-sm";
            
            toast.classList.remove('translate-y-[-150%]', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');
            
            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-[-150%]', 'opacity-0');
            }, 2500);
        }
    </script>
</body>
</html>
