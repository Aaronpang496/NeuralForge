<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NeuralForge AI — Smart Agent</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                }
            }
        }
    </script>
    <!-- Inter Font & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(156, 163, 175, 0.5); border-radius: 3px; }
        .fade-in { animation: fadeIn 0.25s ease-in-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        .prose p { margin-bottom: 0.5em; }
        .prose ul { list-style-type: disc; padding-left: 1.2em; margin-bottom: 0.5em; }
        .prose strong { color: inherit; font-weight: 700; }
        .prose code { background: rgba(0,0,0,0.1); padding: 2px 4px; border-radius: 4px; font-family: monospace; }
        .dark .prose code { background: rgba(255,255,255,0.1); }
    </style>
</head>
<body class="h-full bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 transition-colors duration-200 flex flex-col overflow-hidden">

    <!-- Top Navigation Header -->
    <header class="flex-none h-16 border-b border-slate-200 dark:border-slate-800 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md px-4 flex items-center justify-between z-30">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-indigo-500 to-violet-600 flex items-center justify-center text-white shadow-lg shadow-indigo-500/30">
                <i class="fa-solid fa-brain text-lg"></i>
            </div>
            <div>
                <h1 class="font-bold text-base md:text-lg tracking-tight flex items-center gap-2">
                    NeuralForge <span class="text-xs font-semibold px-2 py-0.5 rounded-full bg-indigo-100 dark:bg-indigo-950/80 text-indigo-600 dark:text-indigo-400 border border-indigo-200 dark:border-indigo-800">Agent</span>
                </h1>
                <p class="text-xs text-slate-500 dark:text-slate-400 hidden sm:block">Live Web Search & Custom Memory</p>
            </div>
        </div>

        <div class="flex items-center space-x-2">
            <div class="bg-slate-100 dark:bg-slate-800/80 p-1 rounded-xl flex items-center border border-slate-200 dark:border-slate-700">
                <button id="navChatBtn" onclick="switchTab('chat')" class="px-3 py-1.5 text-xs font-semibold rounded-lg transition-all flex items-center gap-2 bg-white dark:bg-slate-700 text-slate-900 dark:text-white shadow-sm">
                    <i class="fa-solid fa-comments"></i> <span class="hidden sm:inline">Chat</span>
                </button>
                <button id="navTrainBtn" onclick="switchTab('train')" class="px-3 py-1.5 text-xs font-semibold rounded-lg transition-all flex items-center gap-2 text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white">
                    <i class="fa-solid fa-sliders"></i> <span class="hidden sm:inline">Memory</span>
                </button>
            </div>
            <button onclick="toggleTheme()" class="w-10 h-10 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 flex items-center justify-center text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 transition">
                <i id="themeIcon" class="fa-solid fa-moon"></i>
            </button>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="flex-1 relative overflow-hidden flex">

        <!-- ================= CHAT VIEW ================= -->
        <div id="chatView" class="absolute inset-0 flex flex-col transition-all duration-300 bg-slate-50 dark:bg-slate-950 z-10">
            <div id="chatMessages" class="flex-1 overflow-y-auto p-4 md:p-6 space-y-6 max-w-4xl mx-auto w-full">
                <!-- Welcome Banner -->
                <div class="flex items-start space-x-4 max-w-2xl mx-auto my-6 p-6 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-sm fade-in">
                    <div class="w-10 h-10 rounded-xl bg-indigo-500/10 dark:bg-indigo-500/20 text-indigo-600 dark:text-indigo-400 flex items-center justify-center flex-shrink-0 text-lg">
                        <i class="fa-solid fa-sparkles"></i>
                    </div>
                    <div>
                        <h2 class="font-bold text-base mb-1">NeuralForge Agent Ready</h2>
                        <p class="text-xs sm:text-sm text-slate-600 dark:text-slate-300 leading-relaxed mb-4">
                            I am connected to a real LLM. Toggle <strong>Live Web Search</strong> below to let me fetch and synthesize real-time internet facts, or teach me custom facts in the Memory tab.
                        </p>
                        <div class="flex flex-wrap gap-2">
                            <button onclick="sendQuickPrompt('What are the latest developments in AI this week?')" class="text-xs px-3 py-1.5 rounded-lg bg-slate-100 dark:bg-slate-800 hover:bg-indigo-50 dark:hover:bg-indigo-950/50 hover:text-indigo-600 dark:hover:text-indigo-400 border border-slate-200 dark:border-slate-700 transition">
                                🌐 "Latest AI developments?"
                            </button>
                            <button onclick="sendQuickPrompt('Write a python script to scrape a website.')" class="text-xs px-3 py-1.5 rounded-lg bg-slate-100 dark:bg-slate-800 hover:bg-indigo-50 dark:hover:bg-indigo-950/50 hover:text-indigo-600 dark:hover:text-indigo-400 border border-slate-200 dark:border-slate-700 transition">
                                💻 "Write a Python scraper"
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Input Bar -->
            <div class="flex-none p-4 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-t border-slate-200 dark:border-slate-800 z-20">
                <div class="max-w-3xl mx-auto space-y-3">
                    <!-- Web Search Toggle -->
                    <div class="flex items-center justify-between px-1">
                        <label class="cursor-pointer flex items-center space-x-2 text-xs font-medium text-slate-600 dark:text-slate-300 select-none">
                            <input type="checkbox" id="webSearchToggle" class="w-4 h-4 rounded text-indigo-600 accent-indigo-600 focus:ring-indigo-500 cursor-pointer" checked>
                            <span class="flex items-center gap-1.5">
                                <i class="fa-solid fa-globe text-indigo-500"></i> Live Web Search (Smart Synthesis)
                            </span>
                        </label>
                        <button onclick="clearChat()" class="text-[11px] text-slate-400 hover:text-red-500 transition flex items-center gap-1">
                            <i class="fa-solid fa-trash-can"></i> Clear Chat
                        </button>
                    </div>

                    <form id="chatForm" onsubmit="handleChatSubmit(event)" class="relative flex items-center">
                        <input 
                            type="text" 
                            id="userInput" 
                            placeholder="Ask anything..." 
                            class="w-full pl-4 pr-14 py-3.5 bg-slate-100 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700 rounded-2xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 dark:text-white placeholder-slate-400 shadow-inner"
                            autocomplete="off"
                        >
                        <button 
                            type="submit" 
                            id="sendBtn"
                            class="absolute right-2 w-10 h-10 bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white rounded-xl flex items-center justify-center transition shadow-md shadow-indigo-600/30 disabled:opacity-50 disabled:cursor-not-allowed"
                        >
                            <i class="fa-solid fa-paper-plane text-sm"></i>
                        </button>
                    </form>
                </div>
            </div>
        </div>

        <!-- ================= MEMORY STUDIO VIEW ================= -->
        <div id="trainView" class="absolute inset-0 flex flex-col transition-all duration-300 bg-slate-50 dark:bg-slate-950 z-0 opacity-0 pointer-events-none overflow-y-auto p-4 md:p-8">
            <div class="max-w-4xl mx-auto w-full space-y-6 pb-12">
                
                <!-- System Prompt -->
                <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-5 shadow-sm space-y-4">
                    <h3 class="font-semibold text-sm flex items-center gap-2">
                        <i class="fa-solid fa-id-card text-indigo-500"></i> Core Behavior
                    </h3>
                    <div>
                        <label class="block text-xs font-medium text-slate-700 dark:text-slate-300 mb-1">System Prompt</label>
                        <textarea id="settingSystemPrompt" rows="3" class="w-full px-3 py-2 text-sm bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500">You are NeuralForge, a highly intelligent, concise, and helpful AI assistant. When provided with web search context, synthesize it clearly and cite sources.</textarea>
                    </div>
                    <button onclick="saveSettings()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold rounded-xl transition">Save Behavior</button>
                </div>

                <!-- Custom Knowledge -->
                <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-5 shadow-sm space-y-4">
                    <div class="flex items-center justify-between">
                        <h3 class="font-semibold text-sm flex items-center gap-2">
                            <i class="fa-solid fa-graduation-cap text-indigo-500"></i> Custom Memory
                        </h3>
                        <span id="trainingPairsCount" class="text-xs font-semibold px-2.5 py-1 rounded-full bg-indigo-50 dark:bg-indigo-950/80 text-indigo-600 dark:text-indigo-400 border border-indigo-200 dark:border-indigo-800">0 Items</span>
                    </div>

                    <div class="bg-slate-50 dark:bg-slate-800/40 p-4 rounded-xl border border-slate-200 dark:border-slate-700/80 space-y-3">
                        <div>
                            <label class="block text-xs font-medium text-slate-600 dark:text-slate-300 mb-1">Fact to Remember</label>
                            <input type="text" id="trainKeyword" placeholder="e.g. My name is Alex and I am building an AI app." class="w-full px-3 py-2 text-xs bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        </div>
                        <div class="flex justify-end pt-1">
                            <button onclick="addTrainingPair()" class="px-3.5 py-2 bg-slate-800 dark:bg-slate-700 hover:bg-slate-900 text-white text-xs font-semibold rounded-lg transition shadow-sm flex items-center gap-1.5">
                                <i class="fa-solid fa-plus text-xs"></i> Add to Memory
                            </button>
                        </div>
                    </div>

                    <div class="space-y-2 max-h-64 overflow-y-auto pr-1" id="trainingPairsList"></div>
                </div>

            </div>
        </div>

    </main>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-6 right-6 z-50 transform translate-y-20 opacity-0 transition-all duration-300 pointer-events-none bg-slate-900 dark:bg-white text-white dark:text-slate-900 px-4 py-3 rounded-xl shadow-xl flex items-center space-x-3 text-xs font-medium">
        <i id="toastIcon" class="fa-solid fa-circle-check text-emerald-400 text-sm"></i>
        <span id="toastMessage">Notification</span>
    </div>

    <!-- JavaScript Application Logic -->
    <script>
        // =====================================================================
        // CONFIGURATION: HIDE YOUR API KEY HERE
        // 1. Go to https://www.base64encode.org/
        // 2. Paste your OpenRouter API key (e.g., sk-or-v1-xxxxx)
        // 3. Copy the encoded result and replace the string below.
        // =====================================================================
        const ENCODED_API_KEY = "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"; // <-- REPLACE THIS
        
        function getApiKey() {
            try {
                const decoded = atob(ENCODED_API_KEY);
                if (decoded.includes("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")) {
                    console.warn("Please replace the ENCODED_API_KEY with your actual base64 encoded OpenRouter key.");
                    return "";
                }
                return decoded;
            } catch (e) {
                return "";
            }
        }

        // --- State Management ---
        let currentTab = 'chat';
        let settings = {
            systemPrompt: localStorage.getItem('neural_system_prompt') || 'You are NeuralForge, a highly intelligent, concise, and helpful AI assistant.'
        };
        let trainingPairs = JSON.parse(localStorage.getItem('neural_training_pairs') || '[]');
        let conversationHistory = []; 

        window.onload = function() {
            loadUI();
            renderTrainingPairs();
            
            // Theme init
            if (localStorage.getItem('neural_theme') === 'dark' || (!localStorage.getItem('neural_theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
                document.getElementById('themeIcon').className = "fa-solid fa-sun";
            }
        };

        function switchTab(tab) {
            currentTab = tab;
            const chatView = document.getElementById('chatView');
            const trainView = document.getElementById('trainView');
            const navChatBtn = document.getElementById('navChatBtn');
            const navTrainBtn = document.getElementById('navTrainBtn');

            chatView.className = "absolute inset-0 flex flex-col transition-all duration-300 bg-slate-50 dark:bg-slate-950 z-0 opacity-0 pointer-events-none";
            trainView.className = "absolute inset-0 flex flex-col transition-all duration-300 bg-slate-50 dark:bg-slate-950 z-0 opacity-0 pointer-events-none overflow-y-auto p-4 md:p-8";
            navChatBtn.className = "px-3 py-1.5 text-xs font-semibold rounded-lg transition-all flex items-center gap-2 text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white";
            navTrainBtn.className = "px-3 py-1.5 text-xs font-semibold rounded-lg transition-all flex items-center gap-2 text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white";

            if (tab === 'chat') {
                chatView.className = "absolute inset-0 flex flex-col transition-all duration-300 bg-slate-50 dark:bg-slate-950 z-10 opacity-100";
                navChatBtn.className = "px-3 py-1.5 text-xs font-semibold rounded-lg transition-all flex items-center gap-2 bg-white dark:bg-slate-700 text-slate-900 dark:text-white shadow-sm";
                document.getElementById('userInput').focus();
            } else {
                trainView.className = "absolute inset-0 flex flex-col transition-all duration-300 bg-slate-50 dark:bg-slate-950 z-10 opacity-100 overflow-y-auto p-4 md:p-8";
                navTrainBtn.className = "px-3 py-1.5 text-xs font-semibold rounded-lg transition-all flex items-center gap-2 bg-white dark:bg-slate-700 text-slate-900 dark:text-white shadow-sm";
            }
        }

        function toggleTheme() {
            const html = document.documentElement;
            const icon = document.getElementById('themeIcon');
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                icon.className = "fa-solid fa-moon";
                localStorage.setItem('neural_theme', 'light');
            } else {
                html.classList.add('dark');
                icon.className = "fa-solid fa-sun";
                localStorage.setItem('neural_theme', 'dark');
            }
        }

        function loadUI() {
            document.getElementById('settingSystemPrompt').value = settings.systemPrompt;
        }

        function saveSettings() {
            settings.systemPrompt = document.getElementById('settingSystemPrompt').value;
            localStorage.setItem('neural_system_prompt', settings.systemPrompt);
            showToast("Behavior settings saved!");
        }

        function sendQuickPrompt(text) {
            document.getElementById('userInput').value = text;
            handleChatSubmit(new Event('submit'));
        }

        function clearChat() {
            conversationHistory = [];
            document.getElementById('chatMessages').innerHTML = `
                <div class="flex items-start space-x-4 max-w-2xl mx-auto my-6 p-6 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-sm fade-in">
                    <div class="w-10 h-10 rounded-xl bg-indigo-500/10 dark:bg-indigo-500/20 text-indigo-600 dark:text-indigo-400 flex items-center justify-center flex-shrink-0 text-lg">
                        <i class="fa-solid fa-sparkles"></i>
                    </div>
                    <div>
                        <h2 class="font-bold text-base mb-1">Chat Cleared</h2>
                        <p class="text-xs sm:text-sm text-slate-600 dark:text-slate-300">Memory reset. Ready for a new topic.</p>
                    </div>
                </div>
            `;
        }

        // --- SMART WEB SEARCH LOGIC ---
        async function performWebSearch(query) {
            try {
                // Use AllOrigins as a free CORS proxy to fetch DuckDuckGo HTML
                const targetUrl = `https://html.duckduckgo.com/html?q=${encodeURIComponent(query)}`;
                const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}`;
                
                const response = await fetch(proxyUrl);
                const data = await response.json();
                
                if (!data.contents) return "No search results found.";
                
                // Parse the HTML to extract text snippets
                const parser = new DOMParser();
                const doc = parser.parseFromString(data.contents, 'text/html');
                const snippets = Array.from(doc.querySelectorAll('.result__snippet')).map(el => el.textContent.trim());
                
                if (snippets.length === 0) {
                    // Fallback to Wikipedia API if DDG returns nothing
                    const wikiRes = await fetch(`https://en.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(query)}&srlimit=3&format=json&origin=*`);
                    const wikiData = await wikiRes.json();
                    if (wikiData.query && wikiData.query.search.length > 0) {
                        return "Wikipedia Context: " + wikiData.query.search.map(s => `[${s.title}] ${s.snippet.replace(/<[^>]*>/g, '')}`).join(" | ");
                    }
                    return "No relevant web results found for this query.";
                }
                
                // Return top 4 snippets formatted for the LLM
                return "Live Web Search Results:\n" + snippets.slice(0, 4).map((s, i) => `${i+1}. ${s}`).join("\n");
            } catch (error) {
                console.error("Web search failed:", error);
                return "Web search failed due to network/proxy issues.";
            }
        }

        // --- REAL AI LOGIC (OPENROUTER) ---
        async function handleChatSubmit(e) {
            e.preventDefault();
            const inputField = document.getElementById('userInput');
            const messageText = inputField.value.trim();
            if (!messageText) return;

            const apiKey = getApiKey();
            if (!apiKey || apiKey.includes("YOUR_API_KEY")) {
                showToast("⚠️ API Key missing! Edit the code and add your Base64 encoded key.", "error");
                return;
            }

            appendMessage(messageText, 'user');
            inputField.value = '';
            document.getElementById('sendBtn').disabled = true;

            const isWebSearchEnabled = document.getElementById('webSearchToggle').checked;
            let finalUserMessage = messageText;

            // 1. If web search is on, fetch context first
            if (isWebSearchEnabled) {
                const searchThinkingId = showThinkingIndicator("🔍 Searching the live web...");
                const searchResults = await performWebSearch(messageText);
                removeThinkingIndicator(searchThinkingId);
                
                // Inject search results into the prompt for the LLM to synthesize
                finalUserMessage = `User Query: ${messageText}\n\n[INSTRUCTIONS: Use the following live web search context to answer the user's query accurately. Synthesize the information clearly and cite sources if applicable. If the context is irrelevant, use your general knowledge but mention you couldn't find specific live results.]\n\n[WEB SEARCH CONTEXT]:\n${searchResults}`;
            }

            // 2. Show AI thinking indicator
            const thinkingId = showThinkingIndicator("Thinking...");

            // 3. Prepare System Prompt with Custom Memory
            let systemContent = settings.systemPrompt;
            if (trainingPairs.length > 0) {
                systemContent += "\n\n[USER'S CUSTOM MEMORY / FACTS]:\n";
                trainingPairs.forEach(pair => {
                    systemContent += `- ${pair.keyword}\n`;
                });
            }

            // 4. Add to history and call API
            conversationHistory.push({ role: "user", content: finalUserMessage });

            try {
                const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${apiKey}`,
                        "Content-Type": "application/json",
                        "HTTP-Referer": window.location.href, 
                        "X-Title": "NeuralForge Agent"
                    },
                    body: JSON.stringify({
                        "model": "meta-llama/llama-3.1-8b-instruct:free", // Smart, free model
                        "messages": [
                            { "role": "system", "content": systemContent },
                            ...conversationHistory.slice(-8) // Keep last 8 messages for context window
                        ]
                    })
                });

                if (!response.ok) {
                    const errData = await response.json();
                    throw new Error(errData.error?.message || "API Error");
                }

                const data = await response.json();
                const aiText = data.choices[0].message.content;

                removeThinkingIndicator(thinkingId);
                appendMessage(aiText, 'ai');
                
                conversationHistory.push({ role: "assistant", content: aiText });

            } catch (error) {
                removeThinkingIndicator(thinkingId);
                appendMessage(`⚠️ Error: ${error.message}. Please check your API key or internet connection.`, 'ai');
                console.error(error);
            } finally {
                document.getElementById('sendBtn').disabled = false;
                document.getElementById('userInput').focus();
            }
        }

        function appendMessage(text, sender) {
            const chatMessages = document.getElementById('chatMessages');
            const isUser = sender === 'user';
            
            const messageDiv = document.createElement('div');
            messageDiv.className = `flex items-start space-x-3 max-w-3xl mx-auto w-full fade-in ${isUser ? 'justify-end' : ''}`;

            const avatarBg = isUser ? 'bg-indigo-600 text-white' : 'bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-200';
            const avatarIcon = isUser ? 'fa-user' : 'fa-brain';
            const bubbleBg = isUser 
                ? 'bg-indigo-600 text-white rounded-2xl rounded-tr-sm' 
                : 'bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-slate-800 dark:text-slate-200 rounded-2xl rounded-tl-sm shadow-sm prose dark:prose-invert max-w-none';

            // Basic markdown parsing for bold, lists, and code
            let formattedText = escapeHTML(text)
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\n/g, '<br>');

            let avatarHtml = `<div class="w-8 h-8 rounded-xl ${avatarBg} flex items-center justify-center flex-shrink-0 text-xs shadow-sm"><i class="fa-solid ${avatarIcon}"></i></div>`;
            let contentHtml = `
                <div class="flex-1 max-w-[85%] sm:max-w-[75%]">
                    <div class="flex items-center gap-2 mb-1 ${isUser ? 'justify-end' : ''}">
                        <span class="text-[11px] font-semibold text-slate-500 dark:text-slate-400">${isUser ? 'You' : 'NeuralForge'}</span>
                    </div>
                    <div class="${bubbleBg} p-4 text-xs sm:text-sm leading-relaxed">${formattedText}</div>
                </div>
            `;

            messageDiv.innerHTML = isUser ? contentHtml + avatarHtml : avatarHtml + contentHtml;
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function showThinkingIndicator(text = "Thinking...") {
            const chatMessages = document.getElementById('chatMessages');
            const id = 'thinking-' + Date.now();
            const div = document.createElement('div');
            div.id = id;
            div.className = 'flex items-start space-x-3 max-w-3xl mx-auto w-full fade-in';
            div.innerHTML = `
                <div class="w-8 h-8 rounded-xl bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-200 flex items-center justify-center flex-shrink-0 text-xs shadow-sm"><i class="fa-solid fa-brain"></i></div>
                <div class="flex-1">
                    <div class="flex items-center gap-2 mb-1"><span class="text-[11px] font-semibold text-slate-500 dark:text-slate-400">NeuralForge</span></div>
                    <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-3.5 rounded-2xl rounded-tl-sm shadow-sm inline-flex items-center space-x-2">
                        <span class="text-xs text-slate-500 dark:text-slate-400 italic">${text}</span>
                        <div class="w-2 h-2 rounded-full bg-indigo-500 animate-bounce" style="animation-delay: 0s"></div>
                        <div class="w-2 h-2 rounded-full bg-indigo-500 animate-bounce" style="animation-delay: 0.2s"></div>
                        <div class="w-2 h-2 rounded-full bg-indigo-500 animate-bounce" style="animation-delay: 0.4s"></div>
                    </div>
                </div>
            `;
            chatMessages.appendChild(div);
            chatMessages.scrollTop = chatMessages.scrollHeight;
            return id;
        }

        function removeThinkingIndicator(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
        }

        // --- Memory Studio Actions ---
        function addTrainingPair() {
            const kw = document.getElementById('trainKeyword').value.trim();
            if (!kw) {
                showToast("Please enter a fact to remember!", "error");
                return;
            }
            trainingPairs.push({ id: Date.now(), keyword: kw });
            document.getElementById('trainKeyword').value = '';
            renderTrainingPairs();
            saveData();
            showToast("Fact added to AI Memory!");
        }

        function deleteTrainingPair(id) {
            trainingPairs = trainingPairs.filter(p => p.id !== id);
            renderTrainingPairs();
            saveData();
        }

        function renderTrainingPairs() {
            const container = document.getElementById('trainingPairsList');
            document.getElementById('trainingPairsCount').innerText = `${trainingPairs.length} Items`;
            
            if (trainingPairs.length === 0) {
                container.innerHTML = `<p class="text-xs text-slate-400 italic text-center py-4">No custom memory added. The AI will rely on its base knowledge and web search.</p>`;
                return;
            }
            let html = '';
            trainingPairs.forEach(p => {
                html += `
                    <div class="flex items-center justify-between p-3 rounded-xl bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700/80 gap-3">
                        <div class="min-w-0 flex-1">
                            <p class="text-xs font-medium text-slate-700 dark:text-slate-200">${escapeHTML(p.keyword)}</p>
                        </div>
                        <button onclick="deleteTrainingPair(${p.id})" class="w-7 h-7 rounded-lg text-slate-400 hover:text-red-500 hover:bg-red-50 dark:hover:bg-red-900/30 flex items-center justify-center transition"><i class="fa-solid fa-trash-can text-xs"></i></button>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function saveData() {
            localStorage.setItem('neural_training_pairs', JSON.stringify(trainingPairs));
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
        }

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toastMessage');
            const toastIcon = document.getElementById('toastIcon');
            toastMessage.innerText = message;
            toastIcon.className = type === 'error' ? "fa-solid fa-circle-exclamation text-red-400 text-sm" : "fa-solid fa-circle-check text-emerald-400 text-sm";
            toast.classList.remove('translate-y-20', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');
            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }
    </script>
</body>
</html>
