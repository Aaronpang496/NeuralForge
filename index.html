<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
    <title>NeuralForge Mobile</title>
    <script src="https://tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['-apple-system', 'BlinkMacSystemFont', 'Inter', 'sans-serif'] },
                }
            }
        }
    </script>
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif; 
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .fade-in { animation: fadeIn 0.2s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .bubble-user { 
            background: #4F46E5; 
            color: white; 
            border-radius: 18px 18px 4px 18px; 
        }
        .dark .bubble-user { background: #6366F1; }
        
        .bubble-ai { 
            background: #E2E8F0; 
            color: #0F172A; 
            border-radius: 18px 18px 18px 4px; 
        }
        .dark .bubble-ai { background: #1E293B; color: #F1F5F9; }

        .prose p { margin-bottom: 0.5em; line-height: 1.5; }
        .prose p:last-child { margin-bottom: 0; }
        .prose strong { font-weight: 600; }

        .typing-dot {
            animation: typingBounce 1.4s infinite ease-in-out both;
        }
        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes typingBounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
    </style>
</head>
<body class="h-[100dvh] w-full bg-white dark:bg-slate-950 text-slate-900 dark:text-slate-100 flex flex-col overflow-hidden">

    <!-- Header -->
    <header class="flex-none h-14 bg-white/90 dark:bg-slate-900/90 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 flex items-center justify-between px-4 z-20 sticky top-0">
        <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-full bg-gradient-to-br from-indigo-500 to-violet-600 flex items-center justify-center text-white shadow-md">
                <i class="fa-solid fa-brain text-sm"></i>
            </div>
            <div>
                <h1 class="font-semibold text-base leading-tight">NeuralForge</h1>
                <p id="statusText" class="text-[10px] text-slate-500 dark:text-slate-400 font-medium">Online • Free Mode</p>
            </div>
        </div>
        <button onclick="toggleSettings()" aria-label="Open Settings" class="w-10 h-10 rounded-full flex items-center justify-center text-slate-600 dark:text-slate-300 active:bg-slate-100 dark:active:bg-slate-800 transition">
            <i class="fa-solid fa-sliders text-lg"></i>
        </button>
    </header>

    <!-- Chat Messages Area -->
    <main id="chatView" class="flex-1 overflow-y-auto no-scrollbar p-4 space-y-4 bg-slate-50 dark:bg-slate-950 scroll-smooth">
        <div id="welcomeScreen" class="flex flex-col items-center text-center py-8 fade-in">
            <div class="w-16 h-16 rounded-2xl bg-indigo-100 dark:bg-indigo-900/30 text-indigo-600 dark:text-indigo-400 flex items-center justify-center text-2xl mb-3 shadow-sm">
                <i class="fa-solid fa-sparkles"></i>
            </div>
            <h2 class="font-semibold text-lg mb-1">How can I help you today?</h2>
            <p class="text-sm text-slate-500 dark:text-slate-400 max-w-xs mb-6">Powered by OpenRouter's free AI models. Ask a question or tap a prompt below.</p>
            
            <div class="grid grid-cols-1 gap-2 w-full max-w-xs">
                <button onclick="sendQuickPrompt('Write a clean JavaScript function to debounce an input')" class="text-sm p-3 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-left active:scale-95 transition shadow-sm">
                    💻 <span class="font-medium">Write a debounce function in JS</span>
                </button>
                <button onclick="sendQuickPrompt('Explain quantum computing like I am 5')" class="text-sm p-3 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-left active:scale-95 transition shadow-sm">
                    🧠 <span class="font-medium">Explain quantum computing simply</span>
                </button>
            </div>
        </div>
    </main>

    <!-- Input Bar -->
    <div class="flex-none bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 p-3 pb-[calc(0.75rem+env(safe-area-inset-bottom))] z-20">
        <div class="flex items-center justify-between px-1 mb-2">
            <label class="flex items-center gap-2 cursor-pointer">
                <div class="relative inline-flex items-center cursor-pointer">
                    <input type="checkbox" id="webSearchToggle" class="sr-only peer" onchange="updateStatusText()">
                    <div class="w-9 h-5 bg-slate-200 peer-focus:outline-none rounded-full peer dark:bg-slate-700 peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-indigo-600"></div>
                </div>
                <span class="text-xs font-medium text-slate-600 dark:text-slate-300 flex items-center gap-1">
                    <i class="fa-solid fa-globe text-indigo-500"></i> Live Web Search <span class="text-[10px] text-slate-400">(uses credits)</span>
                </span>
            </label>
            <button onclick="clearChat()" class="text-xs text-slate-400 hover:text-red-500 active:text-red-500 transition font-medium">Clear</button>
        </div>

        <form id="chatForm" onsubmit="handleChatSubmit(event)" class="flex items-end gap-2">
            <div class="flex-1 bg-slate-100 dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 focus-within:ring-2 focus-within:ring-indigo-500 focus-within:border-transparent transition">
                <input 
                    type="text" 
                    id="userInput" 
                    placeholder="Message NeuralForge..." 
                    class="w-full bg-transparent px-4 py-3 text-base focus:outline-none dark:text-white placeholder-slate-400"
                    autocomplete="off"
                    enterkeyhint="send"
                >
            </div>
            <button 
                type="submit" 
                id="sendBtn"
                aria-label="Send Message"
                class="w-12 h-12 bg-indigo-600 hover:bg-indigo-700 active:scale-90 text-white rounded-full flex items-center justify-center transition shadow-md disabled:opacity-50 disabled:active:scale-100 flex-shrink-0"
            >
                <i class="fa-solid fa-paper-plane text-lg"></i>
            </button>
        </form>
    </div>
    <!-- Settings Slide-Up Panel -->
    <div id="settingsPanel" class="fixed inset-0 z-50 transform translate-y-full transition-transform duration-300 ease-out bg-white dark:bg-slate-950 flex flex-col">
        <div class="flex-none h-14 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between px-4 bg-white dark:bg-slate-950">
            <button onclick="toggleSettings()" aria-label="Close Settings" class="w-10 h-10 rounded-full flex items-center justify-center text-indigo-600 dark:text-indigo-400 active:bg-slate-100 dark:active:bg-slate-800 transition">
                <i class="fa-solid fa-chevron-down text-lg"></i>
            </button>
            <h2 class="font-semibold text-base">AI Memory & Settings</h2>
            <button onclick="saveSettings()" class="text-sm font-semibold text-indigo-600 dark:text-indigo-400 px-2 py-1 rounded-lg active:bg-indigo-50 dark:active:bg-indigo-950">Save</button>
        </div>

        <div class="flex-1 overflow-y-auto p-4 space-y-6 no-scrollbar">
            <div class="flex items-center justify-between p-3.5 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl">
                <div>
                    <p class="text-sm font-medium">Dark Mode</p>
                    <p class="text-xs text-slate-500 dark:text-slate-400">Switch between light and dark themes</p>
                </div>
                <label class="relative inline-flex items-center cursor-pointer">
                    <input type="checkbox" id="darkModeToggle" class="sr-only peer" onchange="toggleDarkMode(this.checked)">
                    <div class="w-11 h-6 bg-slate-200 peer-focus:outline-none rounded-full peer dark:bg-slate-700 peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-indigo-600"></div>
                </label>
            </div>

            <div class="space-y-2">
                <label for="settingSystemPrompt" class="text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider">Behavior & System Prompt</label>
                <textarea id="settingSystemPrompt" rows="3" placeholder="e.g., You are a concise, helpful coding assistant..." class="w-full p-3 text-sm bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
            </div>

                <label for="settingMemory" class="text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider">Custom Memory</label>
                <textarea id="settingMemory" rows="4" placeholder="Add facts the AI should remember about you..." class="w-full p-3 text-sm bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
            </div>

                <label for="settingModel" class="text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider">Free OpenRouter Model</label>
                <select id="settingModel" class="w-full p-3 text-sm bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <option value="openrouter/free">Auto Free Router (Recommended)</option>
                    <option value="google/gemma-4-31b-it:free">Google Gemma 4 31B (Free)</option>
                    <option value="nvidia/nemotron-3.5-super-vl:free">NVIDIA Nemotron 3.5 Super (Free)</option>
                    <option value="nvidia/nemotron-3-ultra-550b-a55b:free">NVIDIA Nemotron 3 Ultra (Free)</option>
                    <option value="baidu/ernie-5.5-flash-preview:free">ERNIE 5.5 Flash Preview (Free)</option>
                </select>
            </div>
        </div>
    </div>

    <script>
        const OPENROUTER_API_KEY = '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';
        const STORAGE_KEY = 'neuralforge_settings_v3';
        let chatHistory = [];
        let isGenerating = false;

        const defaultSettings = {
            darkMode: window.matchMedia('(prefers-color-scheme: dark)').matches,
            systemPrompt: 'You are NeuralForge, a helpful, concise mobile AI assistant.',
            memory: '',
            model: 'openrouter/free'
        };

        let settings = { ...defaultSettings, ...JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}') };

        document.addEventListener('DOMContentLoaded', () => {
            applyDarkMode(settings.darkMode);
            document.getElementById('darkModeToggle').checked = settings.darkMode;
            document.getElementById('settingSystemPrompt').value = settings.systemPrompt;
            document.getElementById('settingMemory').value = settings.memory;
            document.getElementById('settingModel').value = settings.model;
            updateStatusText();
        });

        function toggleSettings() {
            document.getElementById('settingsPanel').classList.toggle('translate-y-full');
        }

        function saveSettings() {
            settings.systemPrompt = document.getElementById('settingSystemPrompt').value.trim();
            settings.memory = document.getElementById('settingMemory').value.trim();
            settings.model = document.getElementById('settingModel').value;
            localStorage.setItem(STORAGE_KEY, JSON.stringify(settings));
            toggleSettings();
        }

        function toggleDarkMode(isDark) {
            settings.darkMode = isDark;
            applyDarkMode(isDark);
            localStorage.setItem(STORAGE_KEY, JSON.stringify(settings));
        }

        function applyDarkMode(isDark) {
            document.documentElement.classList.toggle('dark', isDark);
        }

        function updateStatusText() {
            const isWeb = document.getElementById('webSearchToggle').checked;
            document.getElementById('statusText').textContent = isWeb ? 'Online • Smart Search' : 'Online • Free Mode';
        }

        function clearChat() {
            chatHistory = [];
            const chatView = document.getElementById('chatView');
            const welcome = document.getElementById('welcomeScreen');
            chatView.innerHTML = '';
            if (welcome) {
                welcome.classList.remove('hidden');
                chatView.appendChild(welcome);
            }
        }

        function sendQuickPrompt(text) {
            document.getElementById('userInput').value = text;
            handleChatSubmit(new Event('submit'));
        }

        async function handleChatSubmit(e) {
            e.preventDefault();
            if (isGenerating) return;

            const inputEl = document.getElementById('userInput');
            const message = inputEl.value.trim();
            if (!message) return;

            const welcome = document.getElementById('welcomeScreen');
            if (welcome) welcome.classList.add('hidden');

            inputEl.value = '';
            appendMessage('user', message);
            chatHistory.push({ role: 'user', content: message });

            isGenerating = true;
            document.getElementById('sendBtn').disabled = true;
            const typingId = appendTypingIndicator();

            try {
                const reply = await fetchAIResponse();
                removeElement(typingId);
                appendMessage('ai', reply);
                chatHistory.push({ role: 'assistant', content: reply });
            } catch (err) {
                removeElement(typingId);
                appendMessage('ai', `⚠️ **Error:** ${err.message}`);
            } finally {
                isGenerating = false;
                document.getElementById('sendBtn').disabled = false;
            }
        }

        function appendMessage(sender, text) {
            const chatView = document.getElementById('chatView');
            const wrapper = document.createElement('div');
            wrapper.className = `flex ${sender === 'user' ? 'justify-end' : 'justify-start'} fade-in`;

            const bubble = document.createElement('div');
            bubble.className = `max-w-[82%] px-4 py-2.5 text-sm shadow-sm prose ${sender === 'user' ? 'bubble-user' : 'bubble-ai'}`;
            bubble.innerHTML = formatText(text);

            wrapper.appendChild(bubble);
            chatView.appendChild(wrapper);
            chatView.scrollTop = chatView.scrollHeight;
        }

        function appendTypingIndicator() {
            const id = 'typing-' + Date.now();
            const chatView = document.getElementById('chatView');
            const wrapper = document.createElement('div');
            wrapper.id = id;
            wrapper.className = 'flex justify-start fade-in';
            wrapper.innerHTML = `
                <div class="bubble-ai px-4 py-3.5 flex items-center gap-1.5 shadow-sm">
                    <span class="w-2 h-2 rounded-full bg-slate-400 dark:bg-slate-500 typing-dot"></span>
                    <span class="w-2 h-2 rounded-full bg-slate-400 dark:bg-slate-500 typing-dot"></span>
                    <span class="w-2 h-2 rounded-full bg-slate-400 dark:bg-slate-500 typing-dot"></span>
                </div>
            `;
            chatView.appendChild(wrapper);
            chatView.scrollTop = chatView.scrollHeight;
            return id;
        }

        function removeElement(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
        }

        function formatText(str) {
            const escaped = str
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');
            return escaped
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
.split('\n\n')
.map(p => <p>${p.replace(/\n/g, '<br>')}</p>)
.join('');
}
async function fetchAIResponse() {
if (!OPENROUTER_API_KEY || OPENROUTER_API_KEY === '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') {
throw new Error('Please paste your OpenRouter API key into OPENROUTER_API_KEY in the HTML file.');
}
const useWebSearch = document.getElementById('webSearchToggle').checked;
const activeModel = useWebSearch ? ${settings.model}:online : settings.model;
const systemContent = [
settings.systemPrompt,
settings.memory ? User Custom Memory:\n${settings.memory} : ''
].filter(Boolean).join('\n\n');
const response = await fetch('openrouter.ai', {
method: 'POST',
headers: {
'Content-Type': 'application/json',
'Authorization': Bearer ${OPENROUTER_API_KEY},
'HTTP-Referer': window.location.href,
'X-Title': 'NeuralForge Mobile'
},
body: JSON.stringify({
model: activeModel,
messages: [
{ role: 'system', content: systemContent },
...chatHistory.slice(-10)
]
})
});

if (!response.ok) {
const errData = await response.json().catch(() => ({}));
throw new Error(errData.error?.message || HTTP ${response.status});
}
const data = await response.json();
return data.choices.message.content;
}
    </script>
</body>
</html>
